name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run pages:validate
      - name: Keep Cloudflare template zero-config
        run: |
          if grep -Eq '^[A-Za-z_][A-Za-z0-9_]*=' .env.example; then
            echo ".env.example must not declare variables; Cloudflare treats them as first-deploy inputs."
            exit 1
          fi
      - run: npm run build
      - name: Validate Cloudflare Workers bundle
        run: npm run cloudflare:dry-run
